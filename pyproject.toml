[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "receipt-review"
version = "0.1.0"
description = "Local receipt extraction with evidence and human review"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn", "python-multipart", "pillow", "rapidocr-onnxruntime==1.4.4"]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
receipt-review = "receipt_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
receipt_review = ["static/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
